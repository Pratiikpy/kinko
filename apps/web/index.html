<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kinko · a private dollar account</title>
    <meta
      name="description"
      content="Kinko is a private dollar account on Midnight. Every private dollar is a real USDC held in a vault on Ethereum that anyone can count."
    />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121115" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the theme before first paint so a dark-mode reader never sees a
      // white flash. The choice is the reader's own, kept in localStorage.
      (function () {
        try {
          var saved = localStorage.getItem("kinko:theme");
          var dark = saved ? saved === "dark" : false;
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
